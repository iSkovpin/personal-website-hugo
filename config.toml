baseurl = "https://iskovpin.ru"
title = "iskovpin"

theme = "hugo-coder"

locale = "en"
defaultcontentlanguage = "en"

canonifyurls = true

[pagination]
    pagerSize = 20

[markup.highlight]
    style = "b2"
    codeFences = true
    guessSyntax = true

[params]
    author = "Ivan Skovpin"
    description = "Ivan Skovpin's personal website. Senior Golang Developer: high-load services, PostgreSQL, and media processing."
    keywords = "Go,Golang,backend,PostgreSQL,developer,personal"
    info = "Senior Golang Developer"
    avatarurl = "images/avatar.jpg"
    footercontent = "May the force be with you"

    dateformat = "January 2, 2006"

    hideCredits = true
    hideCopyright = true

   rtl = false

   # Specify light/dark colorscheme
   # Supported values:
   # "auto" (use preference set by browser)
   # "dark" (dark background, light foreground)
   # "light" (light background, dark foreground) (default)
   colorScheme = "auto"

   # Hide the toggle button, along with the associated vertical divider
   hideColorSchemeToggle = false

   # Series see also post count
   maxSeeAlsoItems = 5

   # Enable Twemoji
   enableTwemoji = true

   # Custom CSS
   customCSS = []

   # Custom SCSS
   customSCSS = []

   # Custom JS
   customJS = []

[taxonomies]
  series = "series"

